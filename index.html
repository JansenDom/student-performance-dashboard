<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="ledger-header">
    <h1 class="ledger-header__title">Student Performance Dashboard</h1>
    <p class="ledger-header__subtitle">31-ITE &middot; Prelim Grading Ledger</p>
    <p class="ledger-header__meta">Quiz 25% &middot; Lab 35% &middot; Exam 40%</p>
  </header>

  <hr />

  <section aria-label="Search and filters">
    <h2 class="rail-section__label">Find Students</h2>

    <div class="field">
      <label for="searchInput">Search by name</label>
      <input type="text" id="searchInput" placeholder="Enter student name" />
    </div>

    <div class="field">
      <label for="blockFilter">Block</label>
      <select id="blockFilter">
        <option value="All">All</option>
        <option value="31-ITE-01">31-ITE-01</option>
        <option value="31-ITE-02">31-ITE-02</option>
        <option value="31-ITE-03">31-ITE-03</option>
      </select>
    </div>

    <div class="field">
      <label for="statusFilter">Academic status</label>
      <select id="statusFilter">
        <option value="All">All</option>
        <option value="Excellent">Excellent</option>
        <option value="Passed">Passed</option>
        <option value="Needs Improvement">Needs Improvement</option>
        <option value="Failed">Failed</option>
      </select>
    </div>

    <div class="rail-buttons">
      <button type="button" id="applyBtn">Apply Filters</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>
  </section>

  <hr />

  <section aria-label="Class summary">
    <h2 class="rail-section__label">Class Summary</h2>
    <div class="summary-grid">
      <div class="summary-item">
        <span class="summary-item__label">Class Average:</span>
        <span class="summary-item__value" id="classAverage">0.00</span>
      </div>
      <div class="summary-item">
        <span class="summary-item__label">Passing:</span>
        <span class="summary-item__value" id="passingCount">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-item__label">Displayed:</span>
        <span class="summary-item__value" id="displayedCount">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-item__label">Top Student:</span>
        <span class="summary-item__value" id="topStudent">&mdash;</span>
      </div>
    </div>
  </section>

  <hr />

  <section aria-label="Student records">
    <h2 class="rail-section__label">Records</h2>

    <div id="messageArea" role="status"></div>

    <div id="studentList"></div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
